name: macOS Runner Test

# 只测试 macOS 构建机是否可用，不安装任何东西，几十秒结束
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Show macOS version
        run: sw_vers

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Done
        run: echo "macOS runner works"
