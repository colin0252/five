name: Build iOS IPA

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config
          brew link libtool --force

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3.1"
          python -m pip install "kivy>=2.3.0,<2.4.0"
          python -m pip install --upgrade kivy-ios

      - name: Check environment
        run: |
          python --version
          python -m pip --version
          cython --version
          python -m pip show kivy-ios
          which toolchain
          toolchain --help

      - name: Prepare kivy-ios build directory
        run: |
          BUILD_DIR="$RUNNER_TEMP/kivy-ios"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          echo "Kivy-iOS build directory:"
          echo "$BUILD_DIR"

      - name: Build Python3 recipe
        run: |
          BUILD_DIR="$RUNNER_TEMP/kivy-ios"

          cd "$BUILD_DIR"

          echo "=== Current directory ==="
          pwd

          echo "=== Build python3 ==="
          toolchain build python3

      - name: Check Python3 recipe
        run: |
          BUILD_DIR="$RUNNER_TEMP/kivy-ios"

          cd "$BUILD_DIR"

          echo "=== Current directory ==="
          pwd

          echo "=== Recipe status ==="
          toolchain status

      - name: Build Kivy recipe
        run: |
          BUILD_DIR="$RUNNER_TEMP/kivy-ios"

          cd "$BUILD_DIR"

          echo "=== Current directory ==="
          pwd

          echo "=== Build Kivy ==="
          toolchain build kivy

      - name: Create iOS project
        run: |
          BUILD_DIR="$RUNNER_TEMP/kivy-ios"
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"

          cd "$BUILD_DIR"

          echo "=== Current directory ==="
          pwd

          echo "=== Creating iOS project ==="

          rm -rf "$PROJECT_DIR"

          toolchain create colin-app "$GITHUB_WORKSPACE"

          echo "=== Checking generated project ==="

          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/colin-app.xcodeproj/project.pbxproj"

          echo "Project created:"
          ls -lah "$PROJECT_DIR"

      - name: Build iOS app
        run: |
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"

          cd "$PROJECT_DIR"

          echo "=== Current directory ==="
          pwd

          echo "=== Building Xcode project ==="

          xcodebuild \
            -project colin-app.xcodeproj \
            -scheme colin-app \
            -configuration Release \
            -sdk iphoneos \
            PRODUCT_NAME=colin-app \
            PRODUCT_BUNDLE_IDENTIFIER=com.colin.wuxing \
            INFOPLIST_KEY_CFBundleDisplayName="五行排盘" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PROJECT_DIR/build"

      - name: Check app
        run: |
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"

          echo "=== Checking app ==="

          test -d "$PROJECT_DIR/build/colin-app.app"

          ls -lah "$PROJECT_DIR/build/colin-app.app"

      - name: Package IPA
        run: |
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"

          cd "$PROJECT_DIR"

          echo "=== Packaging IPA ==="

          rm -rf Payload
          mkdir Payload

          cp -R build/colin-app.app Payload/

          zip -r colin-app-unsigned.ipa Payload

          echo "=== IPA created ==="
          ls -lh colin-app-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 五行排盘-IPA
          path: ${{ github.workspace }}/../colin-app-unsigned.ipa