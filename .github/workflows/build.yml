name: iOS Build

# 任何分支的提交都会自动触发；也可以在 Actions 页面手动运行
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # 需要强制重建缓存时，把 v1 改成 v2
  CACHE_VERSION: v1

jobs:
  build:
    # macos-latest 是 arm64 池，容量极度拥堵（排队 15 分钟后被取消）
    # macos-15-intel 是独立的 Intel 池，可以绕开拥堵
    runs-on: macos-15-intel
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 技能库：优先用仓库里的 skills.zip，没有就自动下载 ----------
      - name: Prepare skills.zip
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -s skills.zip ]; then
            echo "使用仓库中的 skills.zip"
          else
            # 用户直接上传了官方压缩包也可以，文件名不限（带 panshu / skillpack / skills 即可）
            FOUND=$(find . -maxdepth 1 -type f -name '*.zip' \( -iname '*panshu*' -o -iname '*skillpack*' -o -iname '*skills*' -o -iname '*盘叔盲派*' \) | head -n 1)
            if [ -n "$FOUND" ]; then
              echo "发现仓库里的压缩包：$FOUND，直接用作战能库"
              cp "$FOUND" skills.zip
            fi
          fi
          if [ ! -s skills.zip ]; then
            echo "仓库中没有可用的压缩包，尝试自动下载……"
            rm -f "$GITHUB_WORKSPACE/skills.zip"
            URLS=(
              "https://github.com/watchkd/panshu-mangpai-skillpack/archive/refs/heads/main.zip"
              "https://github.com/x3747991-ship-it/panshu-mangpai-skillpack/archive/refs/heads/main.zip"
              "https://gitcode.com/colin0252/panshu-mangpai-skillpack/archive/refs/heads/main.zip"
            )
            ok=0
            for u in "${URLS[@]}"; do
              echo "尝试：$u"
              rm -rf raw.zip unpacked
              if curl -fL --retry 3 --connect-timeout 20 --max-time 300 -o raw.zip "$u"; then
                if [ -s raw.zip ] && unzip -t raw.zip >/dev/null 2>&1; then
                  mkdir -p unpacked
                  unzip -q raw.zip -d unpacked
                  SKILL_DIR=$(find unpacked -maxdepth 3 -type d -name "盘叔盲派" | head -n 1)
                  if [ -n "$SKILL_DIR" ]; then
                    (
                      cd "$(dirname "$SKILL_DIR")"
                      zip -qr "$GITHUB_WORKSPACE/skills.zip" "盘叔盲派" -x "*/_溯源/*" "*/__pycache__/*"
                    )
                    ok=1
                    echo "打包成功：$u"
                    break
                  fi
                fi
              fi
            done
            rm -rf raw.zip unpacked
            if [ "$ok" != "1" ]; then
              echo "ERROR: 技能库下载失败，三个地址都不可用"
              exit 1
            fi
          fi
          if [ ! -s skills.zip ]; then
            echo "ERROR: 没有生成 skills.zip"
            exit 1
          fi
          ls -lh skills.zip
          COUNT=$(unzip -l skills.zip | grep -c 'SKILL.md' || true)
          echo "SKILL.md 数量：$COUNT"
          if [ "$COUNT" -lt 20 ]; then
            echo "ERROR: skills.zip 里只有 $COUNT 个 SKILL.md，明显不对"
            exit 1
          fi

      # ---------- 字体与星历（有缓存就不再下载） ----------
      - name: Cache font and ephemeris
        id: appres
        uses: actions/cache@v4
        with:
          path: |
            fonts/NotoSansSC-Regular.ttf
            ephemeris/de421.bsp
          key: appres-${{ env.CACHE_VERSION }}

      - name: Download font and ephemeris
        if: steps.appres.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p fonts ephemeris
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf' -o fonts/NotoSansSC-Regular.ttf
          curl -fL --retry 3 'https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de421.bsp' -o ephemeris/de421.bsp
          test -s fonts/NotoSansSC-Regular.ttf
          test -s ephemeris/de421.bsp
          ls -lh fonts/NotoSansSC-Regular.ttf ephemeris/de421.bsp

      # ---------- Python 环境 ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ env.CACHE_VERSION }}

      - name: Install build tools
        run: |
          set -e
          brew install autoconf automake libtool pkg-config
          brew link libtool --force
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3.1"
          python -m pip install "kivy>=2.3.0,<2.4.0"
          python -m pip install --upgrade kivy-ios
          python --version
          python -m pip show kivy-ios
          which toolchain

      # ---------- kivy-ios 编译（缓存命中会自动跳过已编译的部分） ----------
      - name: Cache kivy-ios toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kivy-ios
          key: kivyios-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ env.CACHE_VERSION }}
          restore-keys: |
            kivyios-${{ runner.os }}-

      - name: Build kivy-ios recipes
        run: |
          set -e
          KIVY_IOS_DIR="$RUNNER_TEMP/kivy-ios"
          mkdir -p "$KIVY_IOS_DIR"
          cd "$KIVY_IOS_DIR"
          toolchain build python3
          toolchain build pyobjus
          toolchain build numpy
          toolchain build kivy
          toolchain status

      - name: Install Python packages
        run: |
          set -e
          cd "$RUNNER_TEMP/kivy-ios"
          toolchain pip3 install skyfield jplephem sgp4 certifi tzdata
          toolchain pip3 show skyfield
          toolchain pip3 show jplephem
          toolchain pip3 show tzdata

      # ---------- 生成 Xcode 工程 ----------
      - name: Create iOS project
        run: |
          set -e
          KIVY_IOS_DIR="$RUNNER_TEMP/kivy-ios"
          PROJECT_DIR="$KIVY_IOS_DIR/colin-app-ios"
          cd "$KIVY_IOS_DIR"
          rm -rf "$PROJECT_DIR"
          toolchain create colin-app "$GITHUB_WORKSPACE"
          test -f "$PROJECT_DIR/colin-app.xcodeproj/project.pbxproj"
          if [ -s "$GITHUB_WORKSPACE/skills.zip" ]; then
            MAIN_PY=$(find "$PROJECT_DIR" -maxdepth 4 -name main.py | head -n 1)
            if [ -z "$MAIN_PY" ]; then
              echo "ERROR: 找不到 main.py"; exit 1
            fi
            cp "$GITHUB_WORKSPACE/skills.zip" "$(dirname "$MAIN_PY")/skills.zip"
            echo "skills.zip 已放到：$(dirname "$MAIN_PY")"
          fi
          echo "=== app resources ==="
          find "$PROJECT_DIR" \( -name 'de421.bsp' -o -name 'NotoSansSC-Regular.ttf' -o -name 'skills.zip' \) -print

      # ---------- 编译 ----------
      - name: Build iOS app
        run: |
          set -e
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          cd "$PROJECT_DIR"
          xcodebuild \
            -project colin-app.xcodeproj \
            -scheme colin-app \
            -configuration Release \
            -sdk iphoneos \
            PRODUCT_NAME=colin-app \
            PRODUCT_BUNDLE_IDENTIFIER=com.colin.wuxing \
            INFOPLIST_KEY_CFBundleDisplayName="五行排盘" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PROJECT_DIR/build"

      # ---------- 把 skills.zip 直接塞进 .app（不依赖 Xcode 工程是否引用） ----------
      - name: Inject skills.zip into app bundle
        run: |
          set -e
          APP_PATH="$RUNNER_TEMP/kivy-ios/colin-app-ios/build/colin-app.app"
          test -d "$APP_PATH"
          test -s "$GITHUB_WORKSPACE/skills.zip"
          cp "$GITHUB_WORKSPACE/skills.zip" "$APP_PATH/skills.zip"
          MAIN_PY=$(find "$APP_PATH" -name main.py | head -n 1)
          if [ -n "$MAIN_PY" ]; then
            cp "$GITHUB_WORKSPACE/skills.zip" "$(dirname "$MAIN_PY")/skills.zip"
            echo "skills.zip 已放入：$(dirname "$MAIN_PY")"
          fi
          echo "skills.zip 已放入：$APP_PATH"
          ls -lh "$APP_PATH/skills.zip"

      # ---------- 定位权限 ----------
      - name: Configure location permission
        run: |
          set -e
          APP_PATH="$RUNNER_TEMP/kivy-ios/colin-app-ios/build/colin-app.app"
          INFO_PLIST="$APP_PATH/Info.plist"
          test -f "$INFO_PLIST"
          if /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$INFO_PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 用于获取您所在位置的经纬度，以计算真太阳时" "$INFO_PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 用于获取您所在位置的经纬度，以计算真太阳时" "$INFO_PLIST"
          fi
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST"

      # ---------- 检查资源是否进包 ----------
      - name: Verify app resources
        run: |
          set -e
          APP_PATH="$RUNNER_TEMP/kivy-ios/colin-app-ios/build/colin-app.app"
          test -d "$APP_PATH"
          find "$APP_PATH" -name 'de421.bsp' -print
          find "$APP_PATH" -name 'NotoSansSC-Regular.ttf' -print
          find "$APP_PATH" -name 'skills.zip' -print
          if ! find "$APP_PATH" -name 'de421.bsp' -print -quit | grep -q .; then
            echo "ERROR: de421.bsp missing"; exit 1
          fi
          if ! find "$APP_PATH" -name 'NotoSansSC-Regular.ttf' -print -quit | grep -q .; then
            echo "ERROR: Chinese font missing"; exit 1
          fi
          if ! find "$APP_PATH" -name 'skills.zip' -print -quit | grep -q .; then
            echo "WARNING: skills.zip missing，App 内技能库将为空"
          fi

      # ---------- 打包并上传 ----------
      - name: Package IPA
        run: |
          set -e
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          cd "$PROJECT_DIR"
          rm -rf Payload
          mkdir Payload
          cp -R build/colin-app.app Payload/
          zip -r colin-app-unsigned.ipa Payload
          cp colin-app-unsigned.ipa "$GITHUB_WORKSPACE/colin-app-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/colin-app-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 五行排盘-IPA
          path: ${{ github.workspace }}/colin-app-unsigned.ipa
          if-no-files-found: error
