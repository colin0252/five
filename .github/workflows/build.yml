name: Build iOS IPA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache kivy-ios build
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/kivy-ios/dist
            ${{ runner.temp }}/kivy-ios/build
          key: kivy-ios-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            kivy-ios-${{ runner.os }}-py311-

      - name: Prepare Chinese font
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/fonts"
          if [ ! -s "$GITHUB_WORKSPACE/fonts/NotoSansSC-Regular.ttf" ]; then
            curl -fL --retry 3 \
              'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf' \
              -o "$GITHUB_WORKSPACE/fonts/NotoSansSC-Regular.ttf"
          fi
          test -s "$GITHUB_WORKSPACE/fonts/NotoSansSC-Regular.ttf"
          ls -lh "$GITHUB_WORKSPACE/fonts/NotoSansSC-Regular.ttf"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          brew install autoconf automake libtool pkg-config || true
          brew link libtool --force || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3.1"
          python -m pip install -r requirements.txt
          python -m pip install --upgrade kivy-ios

      - name: Check environment
        run: |
          python --version
          python -m pip show kivy-ios          which toolchain

      - name: Build Python3 recipe
        run: |
          BUILD_DIR="$RUNNER_TEMP/kivy-ios"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          toolchain build python3

      - name: Build Kivy recipe
        run: |
          BUILD_DIR="$RUNNER_TEMP/kivy-ios"
          cd "$BUILD_DIR"
          toolchain build kivy

      - name: Create iOS project
        run: |
          BUILD_DIR="$RUNNER_TEMP/kivy-ios"
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          cd "$BUILD_DIR"
          rm -rf "$PROJECT_DIR"
          toolchain create colin-app "$GITHUB_WORKSPACE" \
            --requirements "python3,kivy,plyer"
          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/colin-app.xcodeproj/project.pbxproj"
          ls -lah "$PROJECT_DIR"

      - name: Build iOS app
        run: |
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          cd "$PROJECT_DIR"
          xcodebuild \
            -project colin-app.xcodeproj \
            -scheme colin-app \
            -configuration Release \
            -sdk iphoneos \
            PRODUCT_NAME=colin-app \
            PRODUCT_BUNDLE_IDENTIFIER=com.colin.wuxing \
            INFOPLIST_KEY_CFBundleDisplayName="五行排盘" \
            INFOPLIST_KEY_NSLocationWhenInUseUsageDescription="用于按您所在经度计算真太阳时，使排盘更准确" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PROJECT_DIR/build"

      - name: Check app
        run: |
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          test -d "$PROJECT_DIR/build/colin-app.app"
          ls -lah "$PROJECT_DIR/build/colin-app.app"

      - name: Package IPA
        run: |
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          cd "$PROJECT_DIR"
          rm -rf Payload
          mkdir Payload
          cp -R build/colin-app.app Payload/
          zip -r colin-app-unsigned.ipa Payload
          ls -lh colin-app-unsigned.ipa

      - name: Copy IPA to workspace
        run: |
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          cp "$PROJECT_DIR/colin-app-unsigned.ipa" \
             "$GITHUB_WORKSPACE/colin-app-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 五行排盘-IPA
          path: ${{ github.workspace }}/colin-app-unsigned.ipa
          if-no-files-found: error