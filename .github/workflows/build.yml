
name: Build iOS IPA

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 准备中文字体和 DE421 星历文件
      - name: Prepare app resources
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/fonts"
          mkdir -p "$GITHUB_WORKSPACE/ephemeris"

          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf' \
            -o "$GITHUB_WORKSPACE/fonts/NotoSansSC-Regular.ttf"

          test -s "$GITHUB_WORKSPACE/fonts/NotoSansSC-Regular.ttf"

          curl -fL --retry 3 \
            'https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de421.bsp' \
            -o "$GITHUB_WORKSPACE/ephemeris/de421.bsp"

          test -s "$GITHUB_WORKSPACE/ephemeris/de421.bsp"

          echo "=== Font ==="
          ls -lh "$GITHUB_WORKSPACE/fonts/NotoSansSC-Regular.ttf"

          echo "=== DE421 ==="
          ls -lh "$GITHUB_WORKSPACE/ephemeris/de421.bsp"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          set -e

          brew install autoconf automake libtool pkg-config
          brew link libtool --force

          echo "=== pkg-config ==="
          if command -v pkg-config >/dev/null 2>&1; then
            pkg-config --version
          elif command -v pkgconf >/dev/null 2>&1; then
            pkgconf --version
          else
            echo "ERROR: pkg-config/pkgconf not found"
            exit 1
          fi

      - name: Install build tools
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3.1"
          python -m pip install "kivy>=2.3.0,<2.4.0"
          python -m pip install --upgrade kivy-ios

      - name: Check environment
        run: |
          set -e

          python --version
          python -m pip --version
          cython --version
          python -m pip show kivy-ios
          which toolchain
          toolchain --help

      - name: Prepare kivy-ios build directory
        run: |
          set -e

          BUILD_DIR="$RUNNER_TEMP/kivy-ios"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          echo "Kivy-iOS build directory: $BUILD_DIR"

      - name: Build Python3 recipe
        run: |
          set -e

          cd "$RUNNER_TEMP/kivy-ios"
          toolchain build python3

      - name: Build Pyobjus recipe
        run: |
          set -e

          cd "$RUNNER_TEMP/kivy-ios"
          toolchain build pyobjus
          toolchain status

      - name: Build NumPy recipe
        run: |
          set -e

          cd "$RUNNER_TEMP/kivy-ios"
          toolchain build numpy
          toolchain status

      - name: Build Kivy recipe
        run: |
          set -e

          cd "$RUNNER_TEMP/kivy-ios"
          toolchain build kivy

      # 安装 Skyfield、星历读取和时区数据库依赖
      - name: Install Skyfield dependencies
        run: |
          set -e

          cd "$RUNNER_TEMP/kivy-ios"

          toolchain pip3 install skyfield jplephem sgp4 certifi tzdata

          echo "=== Installed dependencies ==="
          toolchain pip3 show skyfield
          toolchain pip3 show jplephem
          toolchain pip3 show tzdata

      - name: Check compiled recipes
        run: |
          set -e

          cd "$RUNNER_TEMP/kivy-ios"
          toolchain status

      # 创建 iOS 项目
      - name: Create iOS project
        run: |
          set -e

          BUILD_DIR="$RUNNER_TEMP/kivy-ios"
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"

          cd "$BUILD_DIR"
          rm -rf "$PROJECT_DIR"

          toolchain create colin-app "$GITHUB_WORKSPACE"

          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/colin-app.xcodeproj/project.pbxproj"

          echo "=== App source resources ==="
          find "$PROJECT_DIR" \
            \( -name 'de421.bsp' -o -name 'NotoSansSC-Regular.ttf' \) \
            -print

          ls -lah "$PROJECT_DIR"

      # 编译 iOS 应用
      - name: Build iOS app
        run: |
          set -e

          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          cd "$PROJECT_DIR"

          xcodebuild \
            -project colin-app.xcodeproj \
            -scheme colin-app \
            -configuration Release \
            -sdk iphoneos \
            PRODUCT_NAME=colin-app \
            PRODUCT_BUNDLE_IDENTIFIER=com.colin.wuxing \
            INFOPLIST_KEY_CFBundleDisplayName="五行排盘" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PROJECT_DIR/build"

      # 配置并检查 iOS 定位权限
      - name: Configure and verify location permission
        run: |
          set -e

          APP_PATH="$RUNNER_TEMP/kivy-ios/colin-app-ios/build/colin-app.app"
          INFO_PLIST="$APP_PATH/Info.plist"

          test -d "$APP_PATH"
          test -f "$INFO_PLIST"

          if /usr/libexec/PlistBuddy \
            -c "Print :NSLocationWhenInUseUsageDescription" \
            "$INFO_PLIST" >/dev/null 2>&1; then

            /usr/libexec/PlistBuddy \
              -c "Set :NSLocationWhenInUseUsageDescription 用于获取您所在位置的经纬度，以计算真太阳时" \
              "$INFO_PLIST"
          else
            /usr/libexec/PlistBuddy \
              -c "Add :NSLocationWhenInUseUsageDescription string 用于获取您所在位置的经纬度，以计算真太阳时" \
              "$INFO_PLIST"
          fi

          echo "=== Location permission ==="
          /usr/libexec/PlistBuddy \
            -c "Print :NSLocationWhenInUseUsageDescription" \
            "$INFO_PLIST"

          echo "=== Bundle identifier ==="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$INFO_PLIST"

      # 检查星历和中文字体是否进入最终应用
      - name: Verify app resources
        run: |
          set -e

          APP_PATH="$RUNNER_TEMP/kivy-ios/colin-app-ios/build/colin-app.app"

          test -d "$APP_PATH"

          echo "=== Verify DE421 in app bundle ==="
          find "$APP_PATH" -name 'de421.bsp' -print

          if ! find "$APP_PATH" -name 'de421.bsp' \
            -print -quit | grep -q .; then
            echo "ERROR: de421.bsp is missing from the app bundle"
            exit 1
          fi

          echo "=== Verify Chinese font ==="
          find "$APP_PATH" -name 'NotoSansSC-Regular.ttf' -print

          if ! find "$APP_PATH" -name 'NotoSansSC-Regular.ttf' \
            -print -quit | grep -q .; then
            echo "ERROR: Chinese font is missing from the app bundle"
            exit 1
          fi

      - name: Check app
        run: |
          set -e

          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"

          test -d "$PROJECT_DIR/build/colin-app.app"
          ls -lah "$PROJECT_DIR/build/colin-app.app"

      # 打包 IPA
      - name: Package IPA
        run: |
          set -e

          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          cd "$PROJECT_DIR"

          rm -rf Payload
          mkdir Payload

          cp -R build/colin-app.app Payload/

          zip -r colin-app-unsigned.ipa Payload

          ls -lh colin-app-unsigned.ipa

      - name: Copy IPA to workspace
        run: |
          set -e

          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"

          cp "$PROJECT_DIR/colin-app-unsigned.ipa" \
            "$GITHUB_WORKSPACE/colin-app-unsigned.ipa"

          ls -lh "$GITHUB_WORKSPACE/colin-app-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 五行排盘-IPA
          path: ${{ github.workspace }}/colin-app-unsigned.ipa
          if-no-files-found: error
