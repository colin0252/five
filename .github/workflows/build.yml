name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config
          brew link libtool --force

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3.1"
          python -m pip install "kivy>=2.3.0,<2.4.0"
          python -m pip install --upgrade kivy-ios

      - name: Check environment
        run: |
          python --version
          python -m pip --version
          cython --version
          which toolchain
          toolchain --help

      - name: Build Python
        run: |
          toolchain build python3

      - name: Check Python recipe
        run: |
          toolchain recipes

      - name: Build Kivy
        run: |
          toolchain build kivy

      - name: Create iOS project
        run: |
          rm -rf "$RUNNER_TEMP/colin-app-ios"

          cd "$RUNNER_TEMP"

          toolchain create colin-app "$GITHUB_WORKSPACE"

          test -d "$RUNNER_TEMP/colin-app-ios"
          test -f "$RUNNER_TEMP/colin-app-ios/colin-app.xcodeproj/project.pbxproj"

      - name: Build iOS app
        working-directory: ${{ runner.temp }}/colin-app-ios
        run: |
          xcodebuild \
            -project colin-app.xcodeproj \
            -scheme colin-app \
            -configuration Release \
            -sdk iphoneos \
            PRODUCT_NAME=colin-app \
            PRODUCT_BUNDLE_IDENTIFIER=com.colin.wuxing \
            INFOPLIST_KEY_CFBundleDisplayName="五行排盘" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/colin-app-ios/build"

      - name: Check app
        run: |
          test -d "$RUNNER_TEMP/colin-app-ios/build/colin-app.app"
          ls -lah "$RUNNER_TEMP/colin-app-ios/build/colin-app.app"

      - name: Package IPA
        run: |
          cd "$RUNNER_TEMP/colin-app-ios"

          rm -rf Payload
          mkdir Payload

          cp -R build/colin-app.app Payload/

          zip -r colin-app-unsigned.ipa Payload

          ls -lh colin-app-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 五行排盘-IPA
          path: ${{ runner.temp }}/colin-app-ios/colin-app-unsigned.ipa