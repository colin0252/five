name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      KIVYIOS_ROOT: ${{ runner.temp }}/kivy-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config
          brew link libtool --force

      - name: Upgrade Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3.1"

      - name: Install Kivy
        run: |
          python -m pip install "kivy>=2.3.0,<2.4.0"

      - name: Install kivy-ios
        run: |
          python -m pip install --upgrade kivy-ios

      - name: Check environment
        run: |
          echo "=== Python ==="
          python --version

          echo "=== Pip ==="
          python -m pip --version

          echo "=== Cython ==="
          cython --version

          echo "=== kivy-ios ==="
          python -m pip show kivy-ios

          echo "=== Toolchain ==="
          which toolchain
          toolchain --help

          echo "=== KIVYIOS_ROOT ==="
          echo "$KIVYIOS_ROOT"

      - name: Prepare kivy-ios workspace
        run: |
          rm -rf "$KIVYIOS_ROOT"
          mkdir -p "$KIVYIOS_ROOT"

          echo "Kivy-iOS workspace:"
          ls -la "$KIVYIOS_ROOT"

      - name: Build Python3 recipe
        run: |
          echo "=== Building python3 ==="

          toolchain build python3

          echo "=== Python3 build finished ==="

          if [ -d "$KIVYIOS_ROOT" ]; then
            find "$KIVYIOS_ROOT" -maxdepth 5 -type f | head -200 || true
          fi

      - name: Verify Python3 recipe
        run: |
          echo "=== Checking Python3 recipe ==="

          toolchain recipes

          echo "=== Searching for Python build output ==="

          find "$KIVYIOS_ROOT" -maxdepth 6 \
            \( -iname "*python*" -o -iname "*recipe*" \) \
            -print 2>/dev/null | head -300 || true

      - name: Build Kivy recipe
        run: |
          echo "=== Building Kivy ==="

          toolchain build kivy

          echo "=== Kivy build finished ==="

      - name: Create iOS project
        run: |
          export IOS_PROJECT_DIR="$RUNNER_TEMP/colin-app-ios"

          rm -rf "$IOS_PROJECT_DIR"

          cd "$RUNNER_TEMP"

          echo "=== Creating iOS project ==="
          echo "Project directory: $IOS_PROJECT_DIR"
          echo "Kivy-iOS root: $KIVYIOS_ROOT"

          toolchain create colin-app "$GITHUB_WORKSPACE"

          echo "=== Checking generated project ==="

          test -d "$IOS_PROJECT_DIR"
          test -f "$IOS_PROJECT_DIR/colin-app.xcodeproj/project.pbxproj"

          ls -lah "$IOS_PROJECT_DIR"
          ls -lah "$IOS_PROJECT_DIR/colin-app.xcodeproj"

      - name: Build iOS app
        run: |
          export IOS_PROJECT_DIR="$RUNNER_TEMP/colin-app-ios"

          cd "$IOS_PROJECT_DIR"

          echo "=== Building Xcode project ==="

          xcodebuild \
            -project colin-app.xcodeproj \
            -scheme colin-app \
            -configuration Release \
            -sdk iphoneos \
            PRODUCT_NAME=colin-app \
            PRODUCT_BUNDLE_IDENTIFIER=com.colin.wuxing \
            INFOPLIST_KEY_CFBundleDisplayName="五行排盘" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$IOS_PROJECT_DIR/build"

      - name: Check app
        run: |
          export IOS_PROJECT_DIR="$RUNNER_TEMP/colin-app-ios"

          echo "=== Checking .app ==="

          test -d "$IOS_PROJECT_DIR/build/colin-app.app"

          echo "iOS app build succeeded:"
          ls -lah "$IOS_PROJECT_DIR/build/colin-app.app"

      - name: Package IPA
        run: |
          export IOS_PROJECT_DIR="$RUNNER_TEMP/colin-app-ios"

          cd "$IOS_PROJECT_DIR"

          rm -rf Payload
          mkdir Payload

          cp -R build/colin-app.app Payload/

          zip -r colin-app-unsigned.ipa Payload

          echo "=== IPA created ==="
          ls -lh colin-app-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 五行排盘-IPA
          path: ${{ runner.temp }}/colin-app-ios/colin-app-unsigned.ipa