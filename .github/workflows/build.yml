name: Build 五行排盘 iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          brew update
          brew install autoconf automake

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython
          pip install "kivy>=2.3.0,<2.4.0"
          pip install "kivy-ios>=2024.1.1"

      - name: Check toolchain
        run: |
          which autoconf
          which automake
          cython --version
          toolchain --help

      - name: Build Python and Kivy
        run: |
          toolchain build python3 kivy

      - name: Create iOS project
        run: |
          rm -rf colin-app

          toolchain create colin-app com.colin.wuxing \
            --add-deploydir .

      - name: Build iOS app
        run: |
          cd colin-app

          xcodebuild \
            -project colin-app.xcodeproj \
            -scheme colin-app \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            CONFIGURATION_BUILD_DIR="$PWD/build"

      - name: Package IPA
        run: |
          APP_PATH="colin-app/build/colin-app.app"

          test -d "$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/colin-app.app

          zip -qry colin-app-unsigned.ipa Payload

          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 五行排盘-IPA
          path: colin-app/colin-app-unsigned.ipa
          if-no-files-found: error