name: iOS Build

# 任何分支的提交都会自动触发；也可以在 Actions 页面手动运行
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # 需要强制重建缓存时，把 v1 改成 v2
  CACHE_VERSION: v1

jobs:
  build:
    # macos-latest 是 arm64 池，容量极度拥堵（排队 15 分钟后被取消）
    # macos-15-intel 是独立的 Intel 池，可以绕开拥堵
    runs-on: macos-15-intel
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Python 环境（提前，后面要用 python3 重新打压缩包） ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------- 技能库：优先用仓库里的压缩包，没有就自动下载 ----------
      # 注意：不能用 unzip 解压。GitHub/ GitCode 打的 zipball 里中文文件名
      # 不带 UTF-8 标记，macOS 的 unzip 会报 Illegal byte sequence 然后直接失败。
      # 这里用 Python 的 zipfile 把文件名按 cp437→utf-8 还原，重新打一个干净的包。
      - name: Prepare skills.zip
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -f raw.zip
          if [ -s skills.zip ]; then
            echo "使用仓库中的 skills.zip"
          else
            # 用户直接上传了官方压缩包也可以，文件名不限（带 panshu / skillpack / skills 即可）
            FOUND=$(find . -maxdepth 1 -type f -name '*.zip' \( -iname '*panshu*' -o -iname '*skillpack*' -o -iname '*skills*' -o -iname '*盘叔盲派*' \) | head -n 1)
            if [ -n "$FOUND" ]; then
              echo "发现仓库里的压缩包：$FOUND"
              cp "$FOUND" raw.zip
            fi
          fi
          if [ ! -s skills.zip ] && [ ! -s raw.zip ]; then
            echo "仓库中没有可用的压缩包，尝试自动下载……"
            for u in \
              "https://github.com/watchkd/panshu-mangpai-skillpack/archive/refs/heads/main.zip" \
              "https://github.com/x3747991-ship-it/panshu-mangpai-skillpack/archive/refs/heads/main.zip" \
              "https://gitcode.com/colin0252/panshu-mangpai-skillpack/archive/refs/heads/main.zip"
            do
              echo "尝试：$u"
              rm -f raw.zip
              if curl -fL --retry 3 --connect-timeout 20 --max-time 300 -o raw.zip "$u"; then
                if [ -s raw.zip ]; then
                  break
                fi
              fi
            done
          fi
          if [ -s skills.zip ]; then
            echo "已有 skills.zip，跳过重新打包"
          else
            if [ ! -s raw.zip ]; then
              echo "ERROR: 技能库下载失败，三个地址都不可用"
              exit 1
            fi
            python3 - <<'PY'
          import sys
          import zipfile

          SOURCE = "raw.zip"
          TARGET = "skills.zip"
          FOLDER = "盘叔盲派"


          def real_name(info):
              name = info.filename
              if getattr(info, "flag_bits", 0) & 0x800:
                  return name
              try:
                  return name.encode("cp437").decode("utf-8")
              except Exception:
                  return name


          with zipfile.ZipFile(SOURCE) as src:
              entries = []
              for info in src.infolist():
                  if info.is_dir():
                      continue
                  entries.append((real_name(info), info))

              root = None
              for name, _info in entries:
                  parts = name.split("/")
                  if FOLDER in parts:
                      root = "/".join(parts[: parts.index(FOLDER) + 1])
                      break
              if not root:
                  print("ERROR: 压缩包里找不到「盘叔盲派」目录")
                  sys.exit(1)

              prefix = root + "/"
              count = 0
              with zipfile.ZipFile(
                  TARGET, "w", zipfile.ZIP_DEFLATED
              ) as dst:
                  for name, info in entries:
                      if not name.startswith(prefix):
                          continue
                      rel = name[len(prefix):]
                      if not rel or "_溯源/" in rel or "__pycache__" in rel:
                          continue
                      try:
                          data = src.read(info)
                      except Exception:
                          continue
                      dst.writestr(FOLDER + "/" + rel, data)
                      count += 1
              print("打包文件数：%d" % count)
              if count < 50:
                  print("ERROR: 打包文件太少")
                  sys.exit(1)
          PY
          fi
          rm -f raw.zip
          if [ ! -s skills.zip ]; then
            echo "ERROR: 没有生成 skills.zip"
            exit 1
          fi
          ls -lh skills.zip
          COUNT=$(python3 -c "import zipfile;print(sum(1 for n in zipfile.ZipFile('skills.zip').namelist() if n.endswith('SKILL.md')))")
          echo "SKILL.md 数量：$COUNT"
          if [ "$COUNT" -lt 20 ]; then
            echo "ERROR: skills.zip 里只有 $COUNT 个 SKILL.md，明显不对"
            exit 1
          fi

      # ---------- 字体与星历（有缓存就不再下载） ----------
      - name: Cache font and ephemeris
        id: appres
        uses: actions/cache@v4
        with:
          path: |
            fonts/NotoSansSC-Regular.ttf
            ephemeris/de421.bsp
          key: appres-${{ env.CACHE_VERSION }}

      - name: Download font and ephemeris
        if: steps.appres.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p fonts ephemeris
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf' -o fonts/NotoSansSC-Regular.ttf
          curl -fL --retry 3 'https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de421.bsp' -o ephemeris/de421.bsp
          test -s fonts/NotoSansSC-Regular.ttf
          test -s ephemeris/de421.bsp
          ls -lh fonts/NotoSansSC-Regular.ttf ephemeris/de421.bsp

      # ---------- pip 缓存 ----------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ env.CACHE_VERSION }}

      - name: Install build tools
        run: |
          set -e
          brew install autoconf automake libtool pkg-config
          brew link libtool --force
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3.1"
          python -m pip install "kivy>=2.3.0,<2.4.0"
          python -m pip install --upgrade kivy-ios
          python --version
          python -m pip show kivy-ios
          which toolchain

      # ---------- kivy-ios 编译（缓存命中会自动跳过已编译的部分） ----------
      - name: Cache kivy-ios toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kivy-ios
          key: kivyios-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ env.CACHE_VERSION }}
          restore-keys: |
            kivyios-${{ runner.os }}-

      - name: Build kivy-ios recipes
        run: |
          set -e
          KIVY_IOS_DIR="$RUNNER_TEMP/kivy-ios"
          mkdir -p "$KIVY_IOS_DIR"
          cd "$KIVY_IOS_DIR"
          toolchain build python3
          toolchain build pyobjus
          toolchain build numpy
          toolchain build kivy
          toolchain status

      - name: Install Python packages
        run: |
          set -e
          cd "$RUNNER_TEMP/kivy-ios"
          toolchain pip3 install skyfield jplephem sgp4 certifi tzdata
          toolchain pip3 show skyfield
          toolchain pip3 show jplephem
          toolchain pip3 show tzdata

      # ---------- 生成 Xcode 工程 ----------
      - name: Create iOS project
        run: |
          set -e
          KIVY_IOS_DIR="$RUNNER_TEMP/kivy-ios"
          PROJECT_DIR="$KIVY_IOS_DIR/colin-app-ios"
          cd "$KIVY_IOS_DIR"
          rm -rf "$PROJECT_DIR"
          toolchain create colin-app "$GITHUB_WORKSPACE"
          test -f "$PROJECT_DIR/colin-app.xcodeproj/project.pbxproj"
          echo "=== 工程目录结构（前 60 个） ==="
          find "$PROJECT_DIR" -maxdepth 3 -type d | head -60
          if [ -s "$GITHUB_WORKSPACE/skills.zip" ]; then
            # 不依赖 main.py 的路径：直接找 wuxing 包所在目录，把 zip 放到它旁边
            APP_SRC=$(find "$PROJECT_DIR" -maxdepth 6 -type d -name wuxing | head -n 1)
            if [ -n "$APP_SRC" ]; then
              cp "$GITHUB_WORKSPACE/skills.zip" "$(dirname "$APP_SRC")/skills.zip"
              echo "skills.zip 已放到：$(dirname "$APP_SRC")"
            else
              echo "WARNING: 工程里没找到 wuxing 目录，改由打包后直接塞进 .app"
            fi
          fi
          echo "=== app resources ==="
          find "$PROJECT_DIR" \( -name 'de421.bsp' -o -name 'NotoSansSC-Regular.ttf' -o -name 'skills.zip' \) -print

      # ---------- App 图标：仓库根目录放 appicon.png（1024x1024），自动生成全套尺寸 ----------
      - name: Prepare app icon
        run: |
          set -e
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          ICON_SRC="$GITHUB_WORKSPACE/appicon.png"
          ICON_OUT="$RUNNER_TEMP/appicons"
          rm -rf "$ICON_OUT"
          mkdir -p "$ICON_OUT"
          if [ ! -s "$ICON_SRC" ]; then
            echo "WARNING: 仓库根目录没有 appicon.png，跳过自定义图标"
            exit 0
          fi
          sips -g pixelWidth -g pixelHeight "$ICON_SRC" || true
          make_icon () { sips -z "$2" "$2" "$ICON_SRC" --out "$ICON_OUT/$1" >/dev/null; }
          make_icon "Icon-20@2x.png" 40
          make_icon "Icon-20@3x.png" 60
          make_icon "Icon-29@2x.png" 58
          make_icon "Icon-29@3x.png" 87
          make_icon "Icon-40@2x.png" 80
          make_icon "Icon-40@3x.png" 120
          make_icon "Icon-60@2x.png" 120
          make_icon "Icon-60@3x.png" 180
          make_icon "Icon-76.png" 76
          make_icon "Icon-76@2x.png" 152
          make_icon "Icon-83.5@2x.png" 167
          make_icon "Icon-1024.png" 1024
          ls -lh "$ICON_OUT"
          APPSET=$(find "$PROJECT_DIR" -type d -name 'AppIcon.appiconset' | head -n 1)
          if [ -n "$APPSET" ]; then
            cp "$ICON_OUT"/*.png "$APPSET/"
            cat > "$APPSET/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "Icon-20@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "20x20" },
              { "filename" : "Icon-20@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "20x20" },
              { "filename" : "Icon-29@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "29x29" },
              { "filename" : "Icon-29@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "29x29" },
              { "filename" : "Icon-40@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "40x40" },
              { "filename" : "Icon-40@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "40x40" },
              { "filename" : "Icon-60@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "60x60" },
              { "filename" : "Icon-60@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "60x60" },
              { "filename" : "Icon-76.png", "idiom" : "ipad", "scale" : "1x", "size" : "76x76" },
              { "filename" : "Icon-76@2x.png", "idiom" : "ipad", "scale" : "2x", "size" : "76x76" },
              { "filename" : "Icon-83.5@2x.png", "idiom" : "ipad", "scale" : "2x", "size" : "83.5x83.5" },
              { "filename" : "Icon-1024.png", "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
            echo "已写入 AppIcon.appiconset：$APPSET"
          else
            echo "模板里没有 AppIcon.appiconset，改用 Info.plist 方式"
          fi

      # ---------- 编译 ----------
      - name: Build iOS app
        run: |
          set -e
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          cd "$PROJECT_DIR"
          xcodebuild \
            -project colin-app.xcodeproj \
            -scheme colin-app \
            -configuration Release \
            -sdk iphoneos \
            PRODUCT_NAME=colin-app \
            PRODUCT_BUNDLE_IDENTIFIER=com.colin.wuxing \
            INFOPLIST_KEY_CFBundleDisplayName="五行排盘" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PROJECT_DIR/build"

      # ---------- 把 skills.zip 直接塞进 .app（不依赖 Xcode 工程是否引用） ----------
      - name: Inject skills.zip into app bundle
        run: |
          set -e
          APP_PATH="$RUNNER_TEMP/kivy-ios/colin-app-ios/build/colin-app.app"
          test -d "$APP_PATH"
          test -s "$GITHUB_WORKSPACE/skills.zip"
          echo "=== .app 目录结构（前 40 个） ==="
          find "$APP_PATH" -maxdepth 3 -type d | head -40
          # skills.py 的 root_dir 就是 wuxing 的上一层，所以 zip 必须放在 wuxing 旁边
          APP_SRC=$(find "$APP_PATH" -maxdepth 5 -type d -name wuxing | head -n 1)
          if [ -n "$APP_SRC" ]; then
            cp "$GITHUB_WORKSPACE/skills.zip" "$(dirname "$APP_SRC")/skills.zip"
            echo "skills.zip 已放入：$(dirname "$APP_SRC")"
          else
            echo "WARNING: .app 里没找到 wuxing 目录"
          fi
          # 再放一份到 .app 根目录兜底
          cp "$GITHUB_WORKSPACE/skills.zip" "$APP_PATH/skills.zip"
          echo "skills.zip 已放入：$APP_PATH"
          ls -lh "$APP_PATH/skills.zip"

      # ---------- App 图标：写进 .app 并改 Info.plist ----------
      - name: Inject app icon into bundle
        run: |
          set -e
          APP_PATH="$RUNNER_TEMP/kivy-ios/colin-app-ios/build/colin-app.app"
          ICON_OUT="$RUNNER_TEMP/appicons"
          INFO_PLIST="$APP_PATH/Info.plist"
          if [ ! -d "$ICON_OUT" ]; then
            echo "WARNING: 没有生成图标，跳过"
            exit 0
          fi
          cp "$ICON_OUT"/*.png "$APP_PATH/"
          ls -lh "$APP_PATH"/Icon-*.png
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFiles" "$INFO_PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles array" "$INFO_PLIST"
          for name in Icon-20 Icon-29 Icon-40 Icon-60 Icon-76 Icon-83.5; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles: string $name" "$INFO_PLIST"
          done
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$INFO_PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$INFO_PLIST"
          for name in Icon-20 Icon-29 Icon-40 Icon-60; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles: string $name" "$INFO_PLIST"
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFiles" "$INFO_PLIST" || true

      # ---------- 定位权限 ----------
      - name: Configure location permission
        run: |
          set -e
          APP_PATH="$RUNNER_TEMP/kivy-ios/colin-app-ios/build/colin-app.app"
          INFO_PLIST="$APP_PATH/Info.plist"
          test -f "$INFO_PLIST"
          if /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$INFO_PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 用于获取您所在位置的经纬度，以计算真太阳时" "$INFO_PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 用于获取您所在位置的经纬度，以计算真太阳时" "$INFO_PLIST"
          fi
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST"

      # ---------- 检查资源是否进包 ----------
      - name: Verify app resources
        run: |
          set -e
          APP_PATH="$RUNNER_TEMP/kivy-ios/colin-app-ios/build/colin-app.app"
          test -d "$APP_PATH"
          find "$APP_PATH" -name 'de421.bsp' -print
          find "$APP_PATH" -name 'NotoSansSC-Regular.ttf' -print
          find "$APP_PATH" -name 'skills.zip' -print
          if ! find "$APP_PATH" -name 'de421.bsp' -print -quit | grep -q .; then
            echo "ERROR: de421.bsp missing"; exit 1
          fi
          if ! find "$APP_PATH" -name 'NotoSansSC-Regular.ttf' -print -quit | grep -q .; then
            echo "ERROR: Chinese font missing"; exit 1
          fi
          APP_SRC=$(find "$APP_PATH" -maxdepth 5 -type d -name wuxing | head -n 1)
          if [ -z "$APP_SRC" ]; then
            echo "ERROR: .app 里没有 wuxing 模块目录"
            exit 1
          fi
          if [ ! -s "$(dirname "$APP_SRC")/skills.zip" ]; then
            echo "ERROR: skills.zip 没有放到 wuxing 旁边，App 内技能库将为空"
            exit 1
          fi
          ls -lh "$(dirname "$APP_SRC")/skills.zip"
          echo "=== 图标 ==="
          ls -1 "$APP_PATH"/Icon-*.png 2>/dev/null | wc -l || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFiles" "$APP_PATH/Info.plist" || true

      # ---------- 打包并上传 ----------
      - name: Package IPA
        run: |
          set -e
          PROJECT_DIR="$RUNNER_TEMP/kivy-ios/colin-app-ios"
          cd "$PROJECT_DIR"
          rm -rf Payload
          mkdir Payload
          cp -R build/colin-app.app Payload/
          zip -r colin-app-unsigned.ipa Payload
          cp colin-app-unsigned.ipa "$GITHUB_WORKSPACE/colin-app-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/colin-app-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 五行排盘-IPA
          path: ${{ github.workspace }}/colin-app-unsigned.ipa
          if-no-files-found: error
