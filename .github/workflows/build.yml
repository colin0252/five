name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config
          brew link libtool --force

      - name: Upgrade Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3.1"

      - name: Install Kivy
        run: |
          python -m pip install "kivy>=2.3.0,<2.4.0"

      - name: Install kivy-ios
        run: |
          python -m pip install "kivy-ios"

      - name: Check build environment
        run: |
          python --version
          cython --version
          autoconf --version
          automake --version
          toolchain --help

      - name: Build Python and Kivy
        run: |
          toolchain build python3
          toolchain build kivy

      - name: Create iOS project
        run: |
          export IOS_PROJECT_DIR="$RUNNER_TEMP/colin-app-ios"

          rm -rf "$IOS_PROJECT_DIR"

          cd "$RUNNER_TEMP"

          toolchain create colin-app "$GITHUB_WORKSPACE"

          test -d "$IOS_PROJECT_DIR"
          test -f "$IOS_PROJECT_DIR/colin-app.xcodeproj/project.pbxproj"

      - name: Build iOS app
        run: |
          export IOS_PROJECT_DIR="$RUNNER_TEMP/colin-app-ios"

          xcodebuild \
            -project "$IOS_PROJECT_DIR/colin-app.xcodeproj" \
            -scheme colin-app \
            -configuration Release \
            -sdk iphoneos \
            PRODUCT_NAME=colin-app \
            PRODUCT_BUNDLE_IDENTIFIER=com.colin.wuxing \
            INFOPLIST_KEY_CFBundleDisplayName="五行排盘" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$IOS_PROJECT_DIR/build"

      - name: Check app
        run: |
          export IOS_PROJECT_DIR="$RUNNER_TEMP/colin-app-ios"

          test -d "$IOS_PROJECT_DIR/build/colin-app.app"

          echo "iOS app build succeeded:"
          ls -lah "$IOS_PROJECT_DIR/build/colin-app.app"

      - name: Package IPA
        run: |
          export IOS_PROJECT_DIR="$RUNNER_TEMP/colin-app-ios"

          cd "$IOS_PROJECT_DIR"

          rm -rf Payload
          mkdir Payload

          cp -R build/colin-app.app Payload/

          zip -r colin-app-unsigned.ipa Payload

          ls -lh colin-app-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 五行排盘-IPA
          path: ${{ runner.temp }}/colin-app-ios/colin-app-unsigned.ipa